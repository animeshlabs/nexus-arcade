<!DOCTYPE html>
<html lang="en" data-accent="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEXUS ARCADE — Multi-Game Platform</title>
<meta name="description" content="Nexus Arcade — a polished multi-game platform. Pure vanilla JavaScript.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070a14'/><text x='50' y='68' font-size='54' text-anchor='middle'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- ══════════ BOOT SCREEN ══════════ -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot__logo">
    <span class="boot__mark">◈</span>
    <span class="boot__word">NEXUS<i>ARCADE</i></span>
  </div>
  <div class="boot__bar"><i id="bootBar"></i></div>
  <div class="boot__hint" id="bootHint">initializing engine…</div>
</div>

<!-- ══════════ APP ══════════ -->
<div class="app" id="app">

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Nexus Arcade home">
      <span class="brand__mark">◈</span>
      <span class="brand__word">NEXUS<i>ARCADE</i></span>
    </a>

    <nav class="topnav" id="topnav">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/favorites" data-nav="favorites"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.7 2.4 5 6 5c2.2 0 3.7 1.2 4.5 2.6h3C14.3 6.2 15.8 5 18 5c3.6 0 5.4 3.7 4 6.7C19.5 16.3 12 21 12 21z"/></svg><span>Favorites</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4a7.5 7.5 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2-1.2L16.5 3h-4l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.9 7.9 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2l.4 2.6h4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a>
    </nav>

    <div class="topbar__actions">
      <button class="iconbtn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">
        <svg class="ic-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm15.7.3-1.4-1.4L16 9.2 14.3 7.5l-1.4 1.4 1.7 1.7-1.7 1.7 1.4 1.4 1.7-1.7 1.7 1.7 1.4-1.4-1.7-1.7z"/></svg>
      </button>
      <a class="iconbtn" href="#/favorites" title="Favorites" aria-label="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.7 2.4 5 6 5c2.2 0 3.7 1.2 4.5 2.6h3C14.3 6.2 15.8 5 18 5c3.6 0 5.4 3.7 4 6.7C19.5 16.3 12 21 12 21z"/></svg>
        <i class="badge" id="favBadge" hidden>0</i>
      </a>
    </div>
  </header>

  <main class="stage" id="stage"><!-- routed views render here --></main>

  <footer class="foot">
    <span class="foot__logo">◈ NEXUS ARCADE</span>
    <span class="foot__sep">·</span>
    <span>Built with pure vanilla JS <em>+ Three.js</em></span>
    <span class="foot__sep">·</span>
    <span id="footStats">0 games installed</span>
  </footer>
</div>

<!-- overlays -->
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<!-- vendor -->
<script src="assets/js/vendor/three.min.js"></script>

<!-- core -->
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/audio.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/core/router.js"></script>

<!-- effects -->
<script src="assets/js/effects/holo.js"></script>

<!-- pages -->
<script src="assets/js/pages/home.js"></script>
<script src="assets/js/pages/play.js"></script>
<script src="assets/js/pages/favorites.js"></script>
<script src="assets/js/pages/settings.js"></script>

<!-- game registry (games register themselves here) -->
<script src="assets/js/games/registry.js"></script>
<script src="assets/js/games/pacman.js"></script>
<script src="assets/js/games/bubble.js"></script>
<script src="assets/js/games/tower.js"></script>
<script src="assets/js/games/doodle.js"></script>
<script src="assets/js/games/candy.js"></script>
<script src="assets/js/games/tictactoe.js"></script>
<script src="assets/js/games/flappy.js"></script>
<script src="assets/js/games/crossy.js"></script>
<script src="assets/js/games/2048.js"></script>
<script src="assets/js/games/chess.js"></script>
<script src="assets/js/games/rps.js"></script>
<script src="assets/js/games/archery.js"></script>
<script src="assets/js/games/hangman.js"></script>
<script src="assets/js/games/solitaire.js"></script>
<script src="assets/js/games/breakout.js"></script>
<script src="assets/js/games/snake.js"></script>
<script src="assets/js/games/simon.js"></script>
<script src="assets/js/games/memory.js"></script>
<script src="assets/js/games/pingpong.js"></script>
<script src="assets/js/games/tetris.js"></script>

<!-- boot last -->
<script src="assets/js/core/app.js"></script>
</body>
</html>
